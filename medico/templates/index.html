<!DOCTYPE html>
<html>
<head>
    <title>MediCo - Drug Information Index</title><link rel="icon" href="static/favicon.jpeg" type="image/x-icon">
    <link rel="shortcut icon" href="static/favicon.jpeg" type="image/x-icon">    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('/static/bg.jpg'); /* Path to your background image */
            background-size: auto;
            background-repeat: no-repeat;
            background-position: center;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
            color: #0a0101;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
		.top-right {
            position: absolute; /* or 'fixed' if you want it to stay at the top right when scrolling */
            top: 0;
            right: 0;
            padding: 10px; /* Adjust padding as needed */
        }
        label {
            font-weight: bold;
            color: #555;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid black;
            border-radius: 5px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        h2 {
            margin: 20px 0 10px;
            color: #333;
        }
        p {
			white-space: pre-wrap;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: #f9f9f9;
            color: #333;
        }
        
    .za3ale .tw-menu-btn-image {
    padding-top: 12px;
    padding-bottom: 8px;
}
		
    </style>
</head>

<body>
    <h1>Drug Information Index</h1>
	<div class="top-right">
        <a class="navbar-brand" href="/video"></a>
    </div>
    <div class="container">
        
        <form method="POST">
            <label for="input_text">Enter Medicine Name:</label><br>
            <textarea name="input_text" rows="4" cols="10" style="width: 564px;height: 30px;" required></textarea>
            <label for="target_language">Select target language:</label><br>
            <select name="target_language">
    		{% for lang in languages %}
        		{% if lang.code == 'ml' %} <!-- Check if language code is Malayalam -->
            			<option value="{{ lang.code }}" selected>{{ lang.name }}</option>
        	{% else %}
            			<option value="{{ lang.code }}">{{ lang.name }}</option>
        	{% endif %}
    			{% endfor %}
		</select><br><br>
            <input type="submit" value="Search">
        </form>
        
        {% if input_text %}
        <h2>Details:</h2>
        <p>{{ input_text }}</p>
        {% endif %}
        {% if translated_text %}
        <h2>Translation:</h2>
        <audio controls>
        <source src="{{ audio_filename }}" type="audio/mpeg">
        </audio>
        <p>{{ translated_text }}</p>
        {% endif %}

    </span>
    </div>
</body>
</html>
